name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/lantern ./cmd/lantern
      - run: ./bin/lantern demo
      - run: python3 scripts/test-watch-pty.py
      - name: Linux protocol and ARP runtime tests
        if: runner.os == 'Linux'
        run: make linux-test
